[project]
name = "grove"
version = "1.1.1"
requires-python = ">=3.14.9"
dependencies = [
    "certifi>=2026.10.19",
    "click~=8.4",
    "django~=5.2",
    "django-environ~=0.13",
    "django-extensions~=4.1",
    "django-htmx~=1.27",
    "django-safedelete~=1.4",
    "djangosaml2~=1.12",
    "django-umd-lib-style>=1.2.0",
    "plastron-utils~=4.8",
    "rdflib~=7.6",
    'urlobject~=2.4',
    "waitress~=3.0",
    "whitenoise~=6.12",
]

[project.optional-dependencies]
prod = [
    "psycopg2-binary~=2.9",
]
test = [
    "debugpy~=1.8",
    "freezegun~=1.5",
    "pipdeptree~=2.35",
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "pytest-datadir~=1.8",
    "pytest-django~=4.12",
    "ruff~=0.15",
]

[project.scripts]
grove = "grove.server:run"

[tool.pytest]
DJANGO_SETTINGS_MODULE = "grove.settings"

[tool.coverage.run]
# these were generated by Django
omit = [
    "asgi.py",
    "manage.py",
    "wsgi.py",
]

[tool.ruff]
line-length = 120
exclude = [
  # Ignore auto-generated "migrations" directories
  "migrations"
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# preview is required to enable many pycodestyle rules see
# https://docs.astral.sh/ruff/rules/
preview = true

# Enable pycodestyle errors and warnings
select = ["E", "W"]
